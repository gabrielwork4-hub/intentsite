<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0a0a0a">
    <title>Página não encontrada | Intent Marketing</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=optional" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            align-items: center;
            background: #0a0a0a;
            color: #f5f5f5;
            display: flex;
            font-family: Inter, Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }
        main { max-width: 600px; text-align: center; }
        img { height: auto; margin-bottom: 48px; max-width: 180px; }
        .code { color: #b8f03a; font-size: clamp(4rem, 16vw, 8rem); font-weight: 900; letter-spacing: -0.08em; line-height: 1; }
        h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); letter-spacing: -0.04em; margin: 24px 0 16px; }
        p { color: #b5b5b5; font-size: 1.05rem; line-height: 1.7; margin: 0 auto 32px; max-width: 470px; }
        a { background: #b8f03a; border-radius: 999px; color: #101010; display: inline-block; font-weight: 800; padding: 14px 24px; text-decoration: none; }
        a:hover, a:focus-visible { background: #d2ff69; outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="logo_branco.png" alt="Intent Marketing">
        <div class="code" aria-hidden="true">404</div>
        <h1>Esta página não foi encontrada.</h1>
        <p>O endereço pode estar incorreto ou o conteúdo pode ter sido movido. Volte para a página inicial e encontre a solução que procura.</p>
        <a href="/">Ir para a página inicial</a>
    </main>
</body>
</html>
